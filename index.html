<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumina — AI Smart Gallery</title>
<style>
  :root{
    --text:#f2f3f5; --muted:#9aa0aa; --faint:#6b7077;
    --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.05); --glass-strong:rgba(255,255,255,.12);
    --stroke:rgba(255,255,255,.14); --stroke-soft:rgba(255,255,255,.08);
    --green:#7ee0a5; --red:#ff8a8a; --amber:#ffd27a; --blue:#aab4ff;
    --blur:24px; --r:20px; --r-sm:14px;
    --shadow:0 8px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);line-height:1.55;font-size:14px;letter-spacing:.1px;
    background:
      radial-gradient(1100px 700px at 78% -8%, rgba(255,255,255,.16), transparent 55%),
      radial-gradient(900px 700px at 8% 110%, rgba(255,255,255,.10), transparent 55%),
      linear-gradient(160deg,#1b1c1f 0%,#111214 45%,#0c0d0f 100%);
    background-attachment:fixed}
  #app{min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:999px;font-size:14px;color:var(--text)}
  input,select{font-family:inherit;font-size:14px;padding:10px 13px;border:1px solid var(--stroke);
    border-radius:var(--r-sm);background:rgba(255,255,255,.05);color:var(--text)}
  input:focus,select:focus{outline:none;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.09)}
  input::placeholder{color:var(--faint)}
  select option{background:#1b1c1f}
  .btn{background:rgba(255,255,255,.92);color:#16171a;padding:10px 18px;font-weight:700;
    border:1px solid rgba(255,255,255,.5);box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .btn:hover{background:#fff}
  .btn-sm{padding:6px 13px;font-size:12px}
  .btn-ghost{background:var(--glass);color:var(--text);border:1px solid var(--stroke);backdrop-filter:blur(10px)}
  .btn-ghost:hover{background:var(--glass-strong)}
  .btn-danger{background:rgba(255,138,138,.16);color:var(--red);border:1px solid rgba(255,138,138,.35)}
  .btn-danger:hover{background:rgba(255,138,138,.26)}
  .btn-row{display:flex;gap:9px;flex-wrap:wrap}
  .muted{color:var(--muted)} .small{font-size:12px} .faint{color:var(--faint)}

  /* Splash */
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:200;background:linear-gradient(160deg,#1b1c1f,#0c0d0f);transition:opacity .6s ease}
  .splash.hide{opacity:0;pointer-events:none}
  .splash .logo{font-size:64px;animation:floaty 2.4s ease-in-out infinite}
  .splash h1{font-size:30px;font-weight:800;letter-spacing:1px;margin-top:14px}
  .splash p{color:var(--muted);margin-top:6px}
  .splash .ring{margin-top:26px;width:42px;height:42px;border:3px solid var(--stroke);
    border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* Auth */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-card{background:var(--glass);border:1px solid var(--stroke);border-radius:26px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter:blur(var(--blur)) saturate(140%);padding:34px;width:100%;max-width:400px;
    animation:popIn .5s cubic-bezier(.22,.61,.36,1) both}
  .auth-card .logo{font-size:40px;text-align:center}
  .auth-card h1{font-size:22px;text-align:center;margin:6px 0 2px;font-weight:700}
  .auth-card p.sub{color:var(--muted);text-align:center;margin-bottom:22px}
  .field{margin-bottom:13px}
  .field label{display:block;font-weight:600;margin-bottom:6px;font-size:12.5px;color:var(--muted)}
  .field input{width:100%}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
  .auth-switch a{color:var(--text);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}

  /* Shell */
  .shell{display:flex;min-height:100vh;padding-left:96px}
  .sidebar{position:fixed;left:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
    align-items:center;gap:6px;padding:14px 9px;width:58px;z-index:20;background:var(--glass);
    border:1px solid var(--stroke);border-radius:999px;box-shadow:var(--shadow);
    backdrop-filter:blur(var(--blur)) saturate(140%);animation:slideInRight .5s cubic-bezier(.22,.61,.36,1) both}
  .brand{font-size:22px;padding:4px 0 12px;text-align:center;width:100%;
    border-bottom:1px solid var(--stroke-soft);margin-bottom:6px}
  .nav-item{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;
    border-radius:50%;color:var(--muted);cursor:pointer;transition:background .35s,color .25s,transform .2s}
  .nav-item:hover{background:var(--glass-strong);color:var(--text);transform:scale(1.05)}
  .nav-item.active{background:rgba(255,255,255,.92);color:#16171a;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .nav-icon{font-size:18px}
  .nav-item::after{content:attr(data-tip);position:absolute;left:52px;white-space:nowrap;
    background:rgba(20,21,23,.92);border:1px solid var(--stroke);color:var(--text);padding:5px 10px;
    border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transform:translateX(-4px);
    transition:opacity .15s,transform .15s;backdrop-filter:blur(8px)}
  .nav-item:hover::after{opacity:1;transform:translateX(0)}

  .main{flex:1;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 26px 6px;gap:14px;
    animation:slideUpFade .45s cubic-bezier(.22,.61,.36,1) both}
  .topbar h2{font-size:20px;font-weight:700}
  .topbar .search{flex:1;max-width:360px}
  .topbar .search input{width:100%}
  .topbar-right{display:flex;align-items:center;gap:12px}
  .content{padding:14px 26px 70px;max-width:1200px;animation:slideUpFade .45s cubic-bezier(.22,.61,.36,1) both}

  /* Upload zone */
  .drop{border:1.5px dashed var(--stroke);border-radius:var(--r);padding:46px 20px;text-align:center;
    background:var(--glass-2);cursor:pointer;transition:border-color .2s,background .2s}
  .drop:hover,.drop.over{border-color:rgba(255,255,255,.5);background:var(--glass)}
  .drop .ico{font-size:46px}
  .drop h3{font-size:18px;margin:10px 0 4px;font-weight:700}

  /* Progress */
  .progress{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-top:8px}
  .progress > span{display:block;height:100%;background:rgba(255,255,255,.9);border-radius:99px;transition:width .3s}
  .card{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);padding:20px;
    box-shadow:var(--shadow);backdrop-filter:blur(var(--blur)) saturate(140%)}
  .section-title{font-size:15px;font-weight:700;margin:24px 0 12px}

  /* Stat row */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:6px}
  .stat{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);padding:16px;
    backdrop-filter:blur(var(--blur));animation:slideInRight .5s cubic-bezier(.22,.61,.36,1) both}
  .stat .v{font-size:26px;font-weight:800}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-top:2px}

  /* Photo grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--stroke-soft);
    cursor:pointer;background:#000;animation:popIn .4s cubic-bezier(.22,.61,.36,1) both;transition:transform .2s,box-shadow .2s}
  .thumb:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.5)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ov{position:absolute;inset:auto 0 0 0;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.78));
    font-size:11px;display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
  .thumb .q{font-weight:800}
  .thumb .badges{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap}
  .thumb .sel{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
    background:rgba(0,0,0,.5);border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px}
  .thumb.selected{outline:3px solid #fff;outline-offset:-3px}
  .thumb.selected .sel{background:#fff;color:#16171a}
  .badge{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:99px;backdrop-filter:blur(6px)}
  .badge.best{background:rgba(126,224,165,.9);color:#0c0d0f}
  .badge.dup{background:rgba(255,210,122,.9);color:#0c0d0f}
  .badge.uniq{background:rgba(170,180,255,.85);color:#0c0d0f}

  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--stroke-soft)}
  .pill.green{background:rgba(126,224,165,.14);color:var(--green)} .pill.amber{background:rgba(255,210,122,.14);color:var(--amber)}
  .pill.blue{background:rgba(170,180,255,.14);color:var(--blue)} .pill.gray{background:var(--glass-2);color:var(--muted)}
  .empty{text-align:center;color:var(--faint);padding:50px 10px}

  /* Album cards */
  .albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .album{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);overflow:hidden;
    cursor:pointer;backdrop-filter:blur(var(--blur));animation:slideInRight .5s cubic-bezier(.22,.61,.36,1) both;transition:transform .2s}
  .album:hover{transform:translateY(-4px)}
  .album .cover{aspect-ratio:16/10;background:#000;position:relative}
  .album .cover img{width:100%;height:100%;object-fit:cover}
  .album .albico{position:absolute;top:8px;left:8px;font-size:18px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:rgba(0,0,0,.45);border:1px solid var(--stroke);backdrop-filter:blur(6px)}
  .badge.cat{background:rgba(255,255,255,.92);color:#16171a}
  .album .meta{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
  .album .meta .nm{font-weight:700}

  /* Tabs / filter chips */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;background:var(--glass-2);
    border:1px solid var(--stroke-soft);padding:4px;border-radius:999px;width:fit-content}
  .chip{padding:7px 15px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip:hover{color:var(--text)} .chip.active{background:rgba(255,255,255,.92);color:#16171a}

  /* Modal / lightbox */
  .modal-bg{position:fixed;inset:0;background:rgba(8,9,11,.7);display:flex;align-items:center;justify-content:center;
    z-index:60;padding:20px;backdrop-filter:blur(6px);animation:fadeIn .25s ease both}
  .modal{background:rgba(28,29,32,.78);border:1px solid var(--stroke);border-radius:24px;padding:0;width:100%;
    max-width:880px;max-height:92vh;overflow:hidden;display:flex;
    box-shadow:0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(var(--blur)) saturate(140%);
    animation:popIn .38s cubic-bezier(.22,.61,.36,1) both}
  .modal .imgpane{flex:1.3;background:#000;display:flex;align-items:center;justify-content:center;min-width:0}
  .modal .imgpane img{max-width:100%;max-height:92vh;object-fit:contain}
  .modal .info{flex:1;padding:24px;overflow-y:auto;min-width:280px}
  .modal .info h3{font-size:17px;margin-bottom:4px;word-break:break-word}
  .info-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--stroke-soft);font-size:13px}
  .info-row .k{color:var(--muted)}
  .swatches{display:flex;gap:6px;margin-top:6px}
  .swatch{width:26px;height:26px;border-radius:7px;border:1px solid var(--stroke)}
  .modal .close{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;
    background:var(--glass);border:1px solid var(--stroke);z-index:2;font-size:16px}
  @media(max-width:720px){.modal{flex-direction:column}.modal .imgpane{max-height:40vh}}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(28,29,32,.9);
    border:1px solid var(--stroke);color:var(--text);padding:12px 22px;border-radius:999px;font-size:13px;z-index:300;
    box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(12px);animation:slideUpFade .3s ease both}

  /* selection action bar */
  .selbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
    background:rgba(28,29,32,.85);border:1px solid var(--stroke);border-radius:999px;padding:10px 16px;z-index:40;
    box-shadow:0 14px 40px rgba(0,0,0,.5);backdrop-filter:blur(16px);animation:slideUpFade .3s ease both}

  @media(max-width:820px){.shell{padding-left:0;padding-bottom:84px}
    .sidebar{flex-direction:row;left:50%;top:auto;bottom:14px;transform:translateX(-50%);width:auto;max-width:94vw;overflow-x:auto}
    .brand{display:none}.nav-item::after{display:none}.topbar .search{max-width:none}}

  @keyframes slideUpFade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:translateX(0)}}
  @keyframes popIn{0%{opacity:0;transform:translateY(20px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .stat:nth-child(2){animation-delay:.06s}.stat:nth-child(3){animation-delay:.12s}
  .stat:nth-child(4){animation-delay:.18s}.stat:nth-child(5){animation-delay:.24s}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* =====================================================================
   LUMINA — AI Smart Gallery (single-file, vanilla JS, no backend)
   Implements the 5-phase pipeline from the algorithm design:
   1. Client init & auth   2. Selection & "upload" (validate/batch/retry)
   3. Async AI pipeline (worker queue: colors/quality/blur/embeddings)
   4. Vector clustering & smart album generation (cosine + dHash)
   5. Real-time UI sync & user operations (view/search/filter/rename/
      share/move/delete-dup/restore)
   AI is SIMULATED but uses REAL image signals computed on-canvas.
   ===================================================================== */

/* ---------- CONFIG ---------- */
const PREFIX="lumina";
const VALID_TYPES=["image/jpeg","image/png","image/webp","image/gif","image/bmp"];
const MAX_FILE=25*1024*1024;          // 25MB per file
const BATCH=50;                       // batch size for "upload"
const ANALYZE_SIZE=64;                // downsample for pixel math
const SIM_THRESHOLD=0.86;             // cosine threshold for similar
const DUP_HAMMING=8;                  // dHash hamming <= this => near-duplicate
const SMART_CATS=["People","Places","Time","Objects","Scenes","Events"];

/* ---------- STATE ---------- */
const state={ user:null, route:"library", photos:[], albums:[], deleted:[],
  ui:{ filter:"all", search:"", selected:new Set(), openId:null, openAlbum:null, processing:false } };

/* ---------- UTILS ---------- */
const $=s=>document.querySelector(s);
const appEl=()=>document.getElementById("app");
const nowISO=()=>new Date().toISOString();
function uid(p="id"){ let r; try{r=crypto.randomUUID();}catch{r=Date.now().toString(36)+Math.random().toString(36).slice(2,9);} return p+"_"+r; }
function esc(s){const d=document.createElement("div");d.innerText=(s==null?"":String(s));return d.innerHTML;}
function fmtBytes(b){if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(0)+" KB";return(b/1048576).toFixed(1)+" MB";}
function fmtDate(d){if(!d)return"—";const x=new Date(d);return x.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const yieldUI=()=>new Promise(r=>("requestIdleCallback"in window)?requestIdleCallback(()=>r(),{timeout:60}):setTimeout(r,0));
async function hashPw(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}catch{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return"fb"+h.toString(16);}}

/* ---------- STORAGE (auth + lightweight metadata; NOT image blobs) ---------- */
const K={users:PREFIX+":users",session:PREFIX+":session"};
function load(k,fb){try{const v=JSON.parse(localStorage.getItem(k));return v??fb;}catch{return fb;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch{return false;}}

const Auth={
  async register({name,email,password}){
    const users=load(K.users,[]); if(users.some(u=>u.email===email.toLowerCase()))throw new Error("Account already exists.");
    const salt=uid("s"); const u={id:uid("u"),name,email:email.toLowerCase(),salt,hash:await hashPw(salt+password),createdAt:nowISO()};
    users.push(u); save(K.users,users); return u;
  },
  async login(email,password){
    const u=load(K.users,[]).find(x=>x.email===email.toLowerCase());
    if(!u||u.hash!==await hashPw(u.salt+password))throw new Error("Invalid email or password.");
    save(K.session,{userId:u.id}); state.user=u; return u;
  },
  restore(){const s=load(K.session,null);if(!s)return false;const u=load(K.users,[]).find(x=>x.id===s.userId);if(!u)return false;state.user=u;return true;},
  logout(){localStorage.removeItem(K.session);
    state.photos.forEach(p=>{try{URL.revokeObjectURL(p.url);}catch{}}); // free object URLs
    state.user=null;state.photos=[];state.albums=[];state.deleted=[];state.ui.selected.clear();}
};

/* =====================================================================
   PHASE 3 — REAL IMAGE SIGNAL EXTRACTION (the "AI")
   ===================================================================== */
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}

// One downsampled getImageData feeds every metric (fast + low memory)
function analyzePixels(img){
  const c=document.createElement("canvas");c.width=ANALYZE_SIZE;c.height=ANALYZE_SIZE;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.drawImage(img,0,0,ANALYZE_SIZE,ANALYZE_SIZE);
  const {data}=ctx.getImageData(0,0,ANALYZE_SIZE,ANALYZE_SIZE);
  const W=ANALYZE_SIZE,H=ANALYZE_SIZE;
  const luma=(r,g,b)=>0.2126*r+0.7152*g+0.0722*b;

  // grayscale + brightness
  const gray=new Float32Array(W*H);let totalY=0;
  for(let i=0,p=0;i<data.length;i+=4,p++){const y=luma(data[i],data[i+1],data[i+2]);gray[p]=y;totalY+=y;}
  const brightness=totalY/(W*H)/255; // 0..1

  // sharpness: variance of Laplacian
  let mean=0;const lap=new Float32Array((W-2)*(H-2));let k=0;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const c0=y*W+x;
    const v=4*gray[c0]-gray[c0-1]-gray[c0+1]-gray[c0-W]-gray[c0+W];lap[k++]=v;mean+=v;}
  mean/=lap.length||1;let varc=0;for(let i=0;i<lap.length;i++){const d=lap[i]-mean;varc+=d*d;}
  const sharpness=varc/(lap.length||1);

  // dominant colors via RGB quantization (4 bits/channel)
  const buckets=new Map();
  for(let i=0;i<data.length;i+=4){if(data[i+3]<16)continue;
    const r=data[i],g=data[i+1],b=data[i+2];const key=(r>>4)+","+(g>>4)+","+(b>>4);
    let bk=buckets.get(key);if(!bk){bk={n:0,r:0,g:0,b:0};buckets.set(key,bk);}bk.n++;bk.r+=r;bk.g+=g;bk.b+=b;}
  const dominant=[...buckets.values()].sort((a,b)=>b.n-a.n).slice(0,5)
    .map(b=>({r:Math.round(b.r/b.n),g:Math.round(b.g/b.n),b:Math.round(b.b/b.n),w:b.n/(W*H)}));

  // HSV histogram (8x4x4 = 128) for embedding
  const HB=8,SB=4,VB=4;const hist=new Float32Array(HB*SB*VB);let cnt=0;
  for(let i=0;i<data.length;i+=4){if(data[i+3]<16)continue;
    const [h,s,v]=rgbToHsv(data[i],data[i+1],data[i+2]);
    let hi=Math.min(HB-1,Math.floor(h/360*HB));if(s<0.1)hi=0;
    const si=Math.min(SB-1,Math.floor(s*SB)),vi=Math.min(VB-1,Math.floor(v*VB));
    hist[hi*SB*VB+si*VB+vi]++;cnt++;}
  if(cnt)for(let i=0;i<hist.length;i++)hist[i]/=cnt;

  return {brightness,sharpness,dominant,hist};
}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d!==0){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
  return[h,mx===0?0:d/mx,mx];}

// dHash (9x8 -> 64 bits), bit order MSB-first row-major
function computeDHash(img){
  const c=document.createElement("canvas");c.width=9;c.height=8;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(img,0,0,9,8);
  const {data}=ctx.getImageData(0,0,9,8);
  const g=(x,y)=>{const i=(y*9+x)*4;return 0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];};
  let hash=0n;for(let y=0;y<8;y++)for(let x=0;x<8;x++){hash<<=1n;if(g(x,y)>g(x+1,y))hash|=1n;}
  return hash;
}
function hamming(a,b){let x=a^b,c=0;while(x){x&=x-1n;c++;}return c;}

function qualityScore({sharpness,brightness,w,h}){
  const sN=Math.min(1,Math.log10(1+sharpness)/3);
  const bN=Math.max(0,1-Math.abs(brightness-0.5)*2);
  const mp=(w*h)/1e6,rN=Math.min(1,Math.log10(1+mp)/Math.log10(1+8));
  return Math.round((0.55*sN+0.25*bN+0.20*rN)*100);
}

// embedding = L2norm( [HSV hist (weight 1)]  ++  [dHash bits as ±1 (weight .25)] )
function buildEmbedding(hist,hash){
  const vec=new Float32Array(hist.length+64);
  for(let i=0;i<hist.length;i++)vec[i]=hist[i];
  let t=hash;for(let i=0;i<64;i++){vec[hist.length+i]=((t&1n)?1:-1)*0.25;t>>=1n;}
  let n=0;for(let i=0;i<vec.length;i++)n+=vec[i]*vec[i];n=Math.sqrt(n)||1;
  for(let i=0;i<vec.length;i++)vec[i]/=n;
  return vec;
}
function cosine(a,b){let d=0;for(let i=0;i<a.length;i++)d+=a[i]*b[i];return d;}

/* Simulated-but-deterministic detectors used by the classification tree.
   Real ML isn't available in this demo, so we derive stable pseudo-signals
   from genuine image stats (colour/brightness/sharpness). Same photo ->
   same result every time. */
function detectSignals(sig){
  const {brightness,dominant,sharpness}=sig;
  const top=dominant[0]||{r:0,g:0,b:0};
  const [h,s,v]=rgbToHsv(top.r,top.g,top.b);
  const seed=Math.round(sharpness*1000+brightness*255+(top.r+top.g+top.b));
  // Food: warm reddish/orange dominant + reasonable saturation/brightness
  const warm=(h<45||h>=330);
  const isFood=(warm && s>0.32 && v>0.35 && brightness>0.3) || (seed%7===0 && warm);
  // Face count (pseudo): skin-ish dominant + a seeded count
  const skinish=(h>=5&&h<=55&&s>0.18&&s<0.75&&v>0.35);
  let faces=0;
  if(skinish) faces = (seed%10<2)?2+(seed%3) : 1;   // some multi-face, some solo
  else if(seed%6===0) faces = 1;                     // occasional incidental face
  // Place detected (pseudo): outdoor/landscape cues (sky/green/blue) + sharp enough
  const sky=(h>=185&&h<=255&&s>0.18);
  const green=(h>=80&&h<=165&&s>0.22);
  const place = (sky||green) && sharpness>30;
  return {isFood,faces,place};
}

/* === ADDED ALGORITHM: priority classification tree ===
   Food? -> Food | Faces>1 -> Group | Faces=1 -> Solo |
   Place? -> Places | otherwise -> Others.  Returns ONE category. */
const CATEGORIES={ Food:"🍔", Group:"👥", Solo:"🧍", Places:"📍", Others:"🗂️" };
function classifyPhoto(d){
  if(d.isFood) return "Food";
  if(d.faces>1) return "Group";
  if(d.faces===1) return "Solo";
  if(d.place) return "Places";
  return "Others";
}

// Simulated semantic tags derived deterministically from real signals
function deriveTags(sig){
  const tags=[];const {brightness,dominant,sharpness}=sig;
  const top=dominant[0]||{r:0,g:0,b:0};const [h,s,v]=rgbToHsv(top.r,top.g,top.b);
  // scene guesses from color/brightness
  if(s<0.15&&v>0.6)tags.push("Document");
  if(h>=80&&h<=160&&s>0.25)tags.push("Nature");
  if((h<40||h>320)&&s>0.3&&brightness>0.4)tags.push("Sunset");
  if(h>=180&&h<=250&&s>0.2)tags.push("Sky");
  if(brightness<0.28)tags.push("Night");
  if(brightness>0.78)tags.push("Bright");
  // pseudo face/object presence (deterministic from signal hash)
  const seed=Math.round(sharpness*1000+brightness*255)%100;
  if(seed%3===0)tags.push("People");
  if(seed%4===0)tags.push("Food");
  if(seed%5===0)tags.push("Animal");
  if(!tags.length)tags.push("Misc");
  return [...new Set(tags)];
}

/* =====================================================================
   PHASE 2 + 3 — selection, validate, "upload", queue, worker pipeline
   ===================================================================== */
function validateFiles(files){
  const ok=[],bad=[];
  for(const f of files){
    if(!VALID_TYPES.includes(f.type)){bad.push(f.name+" (unsupported)");continue;}
    if(f.size>MAX_FILE){bad.push(f.name+" (too large)");continue;}
    ok.push(f);
  }
  return {ok,bad};
}

// Simulated upload with batching + retry (Phase 2)
async function uploadAndProcess(files){
  const {ok,bad}=validateFiles(files);
  if(bad.length)toast(bad.length+" file(s) skipped");
  if(!ok.length){state.ui.processing=false;render();return;}
  state.ui.processing=true;
  const status={total:ok.length,uploaded:0,processed:0,phase:"Uploading"};
  renderProgress(status);

  // PHASE 2: batched upload simulation with retry
  const batches=[];for(let i=0;i<ok.length;i+=BATCH)batches.push(ok.slice(i,i+BATCH));
  const queue=[]; // tasks pushed to "background message queue"
  for(const batch of batches){
    for(const f of batch){
      let attempt=0,done=false;
      while(attempt<3&&!done){
        attempt++;
        try{
          await sleep(40); // simulate network
          // Phase 2: store original (object URL), thumbnail, basic metadata
          const url=URL.createObjectURL(f);
          const rec={ id:uid("ph"), name:f.name, size:f.size, type:f.type,
            url, addedAt:nowISO(), takenAt:f.lastModified?new Date(f.lastModified).toISOString():null,
            status:"queued", w:0,h:0 };
          state.photos.push(rec); queue.push({rec,file:f});
          done=true;
        }catch(e){ if(attempt>=3){ toast("Upload failed: "+f.name); } }
      }
      status.uploaded++; renderProgress(status);
    }
  }
  // Phase 2 complete: user could browse now. Phase 3 begins:
  status.phase="Analyzing (AI)"; renderProgress(status);

  // PHASE 3: async worker pulls tasks, processes in chunks
  let i=0;
  for(const task of queue){
    await processTask(task);
    status.processed=++i; renderProgress(status);
    if(i%3===0)await yieldUI(); // keep UI responsive
  }

  // PHASE 4: clustering + smart albums
  buildClustersAndAlbums();

  state.ui.processing=false;
  toast("Processed "+queue.length+" photo(s)");
  render(); // PHASE 5: real-time UI sync
}

async function processTask({rec,file}){
  try{
    const img=await loadImg(rec.url);
    rec.w=img.naturalWidth;rec.h=img.naturalHeight;
    const sig=analyzePixels(img);
    const hash=computeDHash(img);
    rec.brightness=sig.brightness;rec.sharpness=sig.sharpness;rec.dominant=sig.dominant;
    rec.quality=qualityScore({sharpness:sig.sharpness,brightness:sig.brightness,w:rec.w,h:rec.h});
    rec.hash=hash.toString();          // store as string (BigInt not JSON-safe)
    rec._hashBig=hash;                 // keep BigInt in memory for hamming
    rec.vec=buildEmbedding(sig.hist,hash);
    rec.tags=deriveTags(sig);
    // ADDED: run detectors + priority classification tree
    const det=detectSignals(sig);
    rec.faces=det.faces; rec.isFood=det.isFood; rec.place=det.place;
    rec.category=classifyPhoto(det);
    rec.status="ready";
  }catch(e){ rec.status="failed"; }
}

/* =====================================================================
   PHASE 4 — vector clustering + smart album generation
   ===================================================================== */
function buildClustersAndAlbums(){
  const items=state.photos.filter(p=>p.status==="ready");
  // greedy clustering by cosine (best-match), pre-sorted by quality so best is rep
  const sorted=[...items].sort((a,b)=>(b.quality||0)-(a.quality||0));
  const clusters=[];
  for(const it of sorted){
    let best=null,bestSim=-1;
    for(const cl of clusters){const s=cosine(it.vec,cl.rep.vec);if(s>bestSim){bestSim=s;best=cl;}}
    if(best&&bestSim>=SIM_THRESHOLD){best.members.push(it);}
    else clusters.push({rep:it,members:[it]});
  }
  // reset cluster flags
  items.forEach(p=>{p.clusterId=null;p.isBest=false;p.isDuplicate=false;p.isUnique=false;});
  clusters.forEach((cl,ci)=>{
    cl.id="cl_"+ci; cl.best=cl.members[0]; // pre-sorted => highest quality
    cl.members.forEach(m=>{m.clusterId=cl.id;});
    cl.best.isBest=cl.members.length>1;
    // duplicates inside a cluster: dHash hamming close to best
    cl.members.forEach(m=>{ if(m!==cl.best){
      const close=hamming(m._hashBig,cl.best._hashBig)<=DUP_HAMMING;
      m.isDuplicate=close;
    }});
    if(cl.members.length===1)cl.members[0].isUnique=true;
  });
  state.clusters=clusters;

  // smart albums
  const albums=[];

  // ADDED: Category albums from the classification tree (Food/Group/Solo/Places/Others)
  const catMap={};
  items.forEach(p=>{ const c=p.category||"Others"; (catMap[c]=catMap[c]||[]).push(p.id); });
  Object.keys(CATEGORIES).forEach(cat=>{ // fixed order
    const ids=catMap[cat]; if(ids&&ids.length) albums.push(makeAlbum(cat,ids,"category"));
  });

  // tag-based albums (scene/colour guesses)
  const tagMap={};
  items.forEach(p=>(p.tags||[]).forEach(t=>{(tagMap[t]=tagMap[t]||[]).push(p.id);}));
  Object.entries(tagMap).forEach(([tag,ids])=>{
    if(ids.length<1)return;
    albums.push(makeAlbum(tag,ids,"tag"));
  });
  // time album (by month)
  const byMonth={};
  items.forEach(p=>{const d=p.takenAt||p.addedAt;const m=new Date(d).toLocaleDateString("en-IN",{month:"long",year:"numeric"});(byMonth[m]=byMonth[m]||[]).push(p.id);});
  Object.entries(byMonth).forEach(([m,ids])=>albums.push(makeAlbum(m,ids,"time")));

  // preserve any user-renamed albums by name
  const renamed={};state.albums.forEach(a=>{if(a.renamed)renamed[a.key]=a.name;});
  albums.forEach(a=>{if(renamed[a.key]){a.name=renamed[a.key];a.renamed=true;}});
  state.albums=albums;
}
function makeAlbum(name,ids,kind){
  const cover=ids.map(id=>state.photos.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>(b.quality||0)-(a.quality||0))[0];
  return {id:uid("al"),key:kind+":"+name,name,kind,photoIds:[...new Set(ids)],coverId:cover?cover.id:null};
}

function visiblePhotos(){
  let list=state.photos.filter(p=>p.status!=="deleted");
  const f=state.ui.filter,q=state.ui.search.trim().toLowerCase();
  if(f==="best")list=list.filter(p=>p.isBest);
  else if(f==="duplicates")list=list.filter(p=>p.isDuplicate);
  else if(f==="unique")list=list.filter(p=>p.isUnique);
  else if(f==="ready")list=list.filter(p=>p.status==="ready");
  else if(f&&f.startsWith("cat:"))list=list.filter(p=>p.category===f.slice(4));
  if(q)list=list.filter(p=>p.name.toLowerCase().includes(q)||(p.tags||[]).some(t=>t.toLowerCase().includes(q)));
  return list.sort((a,b)=>(b.quality||0)-(a.quality||0));
}

  const n=state.ui.selected.size;if(!n)return"";
  return `<div class="selbar"><strong>${n} selected</strong>
    <button class="btn-ghost btn-sm" data-act="sel-clear">Clear</button>
    <button class="btn-ghost btn-sm" data-act="sel-album">Add to album</button>
    <button class="btn-danger btn-sm" data-act="sel-delete">Delete</button></div>`;
}

function authView(){
  const reg=authMode==="register";
  return `<div class="auth-wrap"><div class="auth-card">
    <div class="logo">✦</div><h1>Lumina</h1><p class="sub">AI Smart Photo Gallery</p>
    <form data-act="${reg?"do-register":"do-login"}">
      ${reg?`<div class="field"><label>Name</label><input name="name" required></div>`:""}
      <div class="field"><label>Email</label><input name="email" type="email" required></div>
      <div class="field"><label>Password</label><input name="password" type="password" minlength="4" required></div>
      <div class="err">${esc(authErr)}</div>
      <button class="btn" style="width:100%">${reg?"Create Account":"Log In"}</button>
    </form>
    <div class="auth-switch">${reg?"Have an account?":"New here?"} <a data-act="auth-toggle">${reg?"Log in":"Register"}</a></div>
  </div></div>`;
}

function viewFor(r){switch(r){case"albums":return albumsView();case"duplicates":return duplicatesView();
  case"trash":return trashView();case"settings":return settingsView();default:return libraryView();}}

let authMode="login",authErr="";
function render(){
  if(!state.user){appEl().innerHTML=authView();return;}
  if(state.ui.openAlbum){renderAlbumDetail();return;}
  appEl().innerHTML=shell(viewFor(state.route));
}
function renderAlbumDetail(){
  const a=state.albums.find(x=>x.id===state.ui.openAlbum);if(!a){state.ui.openAlbum=null;return render();}
  const photos=a.photoIds.map(id=>state.photos.find(p=>p.id===id)).filter(p=>p&&p.status!=="deleted");
  appEl().innerHTML=shell(`<div class="btn-row" style="margin-bottom:14px;align-items:center">
    <button class="btn-ghost btn-sm" data-act="back-albums">‹ Albums</button>
    <strong style="font-size:18px">${esc(a.name)}</strong><span class="muted small">${photos.length} photos</span></div>
    <div class="grid">${photos.map(thumb).join("")}</div>`);
}
function renderProgress(s){
  const pct=Math.round(((s.uploaded+s.processed)/(s.total*2))*100);
  appEl().innerHTML=shell(`<div class="card" style="max-width:520px;margin:30px auto;text-align:center">
    <div class="ico" style="font-size:40px">🧠</div>
    <h3 style="margin:10px 0 4px">${s.phase}</h3>
    <p class="muted small">${s.phase.startsWith("Upload")?`Uploaded ${s.uploaded}/${s.total}`:`Analysed ${s.processed}/${s.total}`}</p>
    <div class="progress"><span style="width:${pct}%"></span></div>
    <p class="muted small" style="margin-top:10px">Extracting colours, detecting blur, generating embeddings &amp; clustering…</p>
  </div>`);
}

/* =====================================================================
   EVENT HANDLING
   ===================================================================== */
function pick(){const inp=$("#filepick");if(inp)inp.click();}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(["do-login","do-register","search"].includes(a))return;
  switch(a){
    case"auth-toggle":authMode=authMode==="login"?"register":"login";authErr="";render();break;
    case"nav":state.route=el.dataset.route;state.ui.openAlbum=null;render();break;
    case"pick":pick();break;
    case"filter":state.ui.filter=el.dataset.f;render();break;
    case"open":
      if(e.target.closest('[data-act="toggle-sel"]'))break;
      state.ui.openId=id;render();break;
    case"toggle-sel":e.stopPropagation();
      state.ui.selected.has(id)?state.ui.selected.delete(id):state.ui.selected.add(id);render();break;
    case"close-light":if(e.target===el||el.classList.contains("close"))state.ui.openId=null,render();break;
    case"open-album":state.ui.openAlbum=id;render();break;
    case"back-albums":state.ui.openAlbum=null;render();break;
    case"rename-album":{e.stopPropagation();const al=state.albums.find(x=>x.id===id);
      const nm=prompt("Rename album:",al.name);if(nm&&nm.trim()){al.name=nm.trim();al.renamed=true;render();}break;}
    case"delete":deletePhoto(id);state.ui.openId=null;render();break;
    case"restore":{const p=state.photos.find(x=>x.id===id);if(p)p.status=p._prev||"ready";render();break;}
    case"empty-trash":state.photos=state.photos.filter(p=>{if(p.status==="deleted"){try{URL.revokeObjectURL(p.url);}catch{}return false;}return true;});buildClustersAndAlbums();render();break;
    case"dedupe":{const cl=state.clusters.find(c=>c.id===el.dataset.cl);
      cl.members.forEach(m=>{if(m!==cl.best&&m.status!=="deleted")deletePhoto(m.id);});toast("Kept the best, deleted the rest");render();break;}
    case"share":{const p=state.photos.find(x=>x.id===id);
      if(navigator.share)navigator.share({title:p.name}).catch(()=>{});else toast("Share link copied (demo)");break;}
    case"sel-clear":state.ui.selected.clear();render();break;
    case"sel-delete":[...state.ui.selected].forEach(deletePhoto);state.ui.selected.clear();render();break;
    case"sel-album":{const nm=prompt("Album name for selected photos:");if(nm&&nm.trim()){
      state.albums.unshift(makeAlbum(nm.trim(),[...state.ui.selected],"custom"));state.ui.selected.clear();toast("Album created");render();}break;}
    case"logout":Auth.logout();render();break;
  }
});

function deletePhoto(id){const p=state.photos.find(x=>x.id===id);if(p){p._prev=p.status;p.status="deleted";}}

document.addEventListener("input",e=>{
  const el=e.target.closest('[data-act="search"]');if(!el)return;
  state.ui.search=el.value;
  // light re-render of grid only would be nicer; full render keeps it simple
  const sc=el.selectionStart;render();
  const ni=$('[data-act="search"]');if(ni){ni.focus();ni.setSelectionRange(sc,sc);}
});

document.addEventListener("change",e=>{
  if(e.target.id==="filepick"){const files=[...e.target.files];e.target.value="";if(files.length)uploadAndProcess(files);}
});

document.addEventListener("submit",async e=>{
  const f=e.target.closest("[data-act]");if(!f)return;e.preventDefault();
  const a=f.dataset.act,v=Object.fromEntries(new FormData(f).entries());
  try{
    if(a==="do-login"){await Auth.login(v.email,v.password);authErr="";render();}
    if(a==="do-register"){await Auth.register(v);await Auth.login(v.email,v.password);authErr="";render();}
  }catch(err){authErr=err.message;render();}
});

// drag & drop onto window
window.addEventListener("dragover",e=>{e.preventDefault();const d=$("#drop");if(d)d.classList.add("over");});
window.addEventListener("dragleave",e=>{const d=$("#drop");if(d)d.classList.remove("over");});
window.addEventListener("drop",e=>{e.preventDefault();const d=$("#drop");if(d)d.classList.remove("over");
  if(state.user&&e.dataTransfer?.files?.length)uploadAndProcess([...e.dataTransfer.files]);});

/* =====================================================================
   PHASE 1 — init & splash
   ===================================================================== */
function boot(){
  const splash=document.createElement("div");
  splash.className="splash";
  splash.innerHTML=`<div class="logo">✦</div><h1>LUMINA</h1><p>AI Smart Gallery</p><div class="ring"></div>`;
  document.body.appendChild(splash);
  Auth.restore();
  render();
  setTimeout(()=>{splash.classList.add("hide");setTimeout(()=>splash.remove(),650);},1500);
}
document.addEventListener("DOMContentLoaded",boot);
</script>
